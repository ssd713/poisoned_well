[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poisoned-well"
version = "0.1.0"
description = "Audit, repair and explain a backdoored streamflow MLP (Kaggle: Fixing the Poisoned Well)"
requires-python = ">=3.11"

# Core runtime. The vendored reference loader needs only numpy + pandas; scipy is
# for the S4 fit, where L-BFGS over ~112 parameters beats hand-rolled descent.
# Deliberately no torch: the model is a 20k-parameter numpy MLP and the upstream
# loader says outright it isn't needed. Revisit only if a heavier method lands.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
# Plots for the writeup, which the competition requires but doesn't grade on visuals.
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
